<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matrix comparison - Biofabric</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/matrix-comparison.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <nav>
    <span class="nav-brand">BGW</span>
    <a href="/">Home</a>
    <a href="/graph.html">Graph</a>
    <a href="/pipeline.html">Pipeline</a>
    <a href="/dataset.html">Dataset</a>
    <a href="/generator.html">Generator</a>
    <a href="/scheduler.html">Scheduler</a>
    <a href="/analysis.html">Analysis</a>
  </nav>

  <main class="comparison-shell">
    <header class="comparison-header">
      <div>
        <a id="back-to-results" class="back-link" href="/result.html">← Results</a>
        <h1>Adjacency matrix comparison</h1>
        <p id="comparison-subtitle">Loading graph and ILP solution…</p>
      </div>
      <label class="method-control" for="reorder-method">
        Ordering method
        <select id="reorder-method" disabled>
          <option value="reverse-cuthill-mckee">Reverse Cuthill–McKee</option>
          <option value="cuthill-mckee">Cuthill–McKee</option>
          <option value="spectral">Spectral ordering</option>
          <option value="optimal-leaf">Optimal leaf ordering</option>
          <option value="pca">PCA ordering</option>
        </select>
      </label>
      <label class="glyph-control" for="glyph-mode">
        <input id="glyph-mode" type="checkbox">
        Glyph mode
      </label>
      <label class="glyph-control" for="show-clique-markers">
        <input id="show-clique-markers" type="checkbox">
        Show clique markers
      </label>
      <label class="range-control" for="matrix-label-size">
        Label size
        <input id="matrix-label-size" type="range" min="8" max="28" step="0.5" value="12">
        <span id="matrix-label-size-value">12.0 px</span>
      </label>
      <label class="range-control" for="matrix-horizontal-marker-distance">
        Horizontal marker distance
        <input id="matrix-horizontal-marker-distance" type="range" min="0" max="40" step="1" value="7">
        <span id="matrix-horizontal-marker-distance-value">7 px</span>
      </label>
      <label class="range-control" for="matrix-vertical-marker-distance">
        Vertical marker distance
        <input id="matrix-vertical-marker-distance" type="range" min="0" max="40" step="1" value="16">
        <span id="matrix-vertical-marker-distance-value">16 px</span>
      </label>
      <label class="range-control" for="matrix-cluster-opacity">
        Cluster opacity
        <input id="matrix-cluster-opacity" type="range" min="0.05" max="1" step="0.01" value="0.82">
        <span id="matrix-cluster-opacity-value">82%</span>
      </label>
    </header>

    <p id="comparison-error" role="alert"></p>
    <section class="matrix-grid" aria-label="Matrix visualizations">
      <article class="matrix-card">
        <div class="matrix-card-head">
          <h2>ILP solution</h2>
          <span id="ilp-order-info">—</span>
        </div>
        <div id="ilp-matrix" class="matrix-canvas"><div class="placeholder">Loading…</div></div>
        <div class="matrix-metric" aria-live="polite">
          <span>Compactness</span>
          <strong id="ilp-compactness">-</strong>
          <small id="ilp-compactness-detail"></small>
        </div>
      </article>
      <article class="matrix-card">
        <div class="matrix-card-head">
          <h2 id="reorder-title">reorder.js</h2>
          <span id="reorder-order-info">—</span>
        </div>
        <div id="reorder-matrix" class="matrix-canvas"><div class="placeholder">Loading…</div></div>
        <div class="matrix-metric" aria-live="polite">
          <span>Compactness</span>
          <strong id="reorder-compactness">-</strong>
          <small id="reorder-compactness-detail"></small>
        </div>
      </article>
    </section>
  </main>

  <script src="/lib/reorder.js"></script>
  <script src="js/matrix-comparison.js"></script>
</body>
</html>
